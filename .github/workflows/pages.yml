name: Storybook to Pages

# PR: 포맷 확인 · lint · 타입 검사 · 층 검사 · 빌드만. main에 합쳐질 때만 Pages로 배포한다
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PR 실행이 main 배포를 취소하지 않게 브랜치마다 따로 묶는다
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # engines.node(>=26)에 맞는 가장 새 LTS. 받아 쓰는 웹 · 어드민의 Vercel도 LTS 판(22 · 24 · 26)만 두고 범위에 맞는 가장 새 판을 고른다.
          # engines를 그대로 읽으면(node-version-file) 2027년 4월 27.0.0이 LTS가 되기 전에 27로 올라가 Vercel(26)과 어긋난다
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check
      - run: npm run build-storybook
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
